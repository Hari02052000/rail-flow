
services:
  postgres:
    image: postgres:17
    container_name: railflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: railflow
      POSTGRES_PASSWORD: railflow_dev_password
      POSTGRES_DB: railflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railflow -d railflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
